# Twinlink relay, containerised.
#
#   export TWINLINK_SECRET='a-shared-secret-at-least-16-bytes'
#   export TWINLINK_WAN_IFACE=eth0
#   docker compose -f deploy/compose.yaml up --build
#
# The secret is passed through the environment (TWINLINK_SECRET) and is never
# written to a config file, an argument list or the log.
services:
  twinlink-relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: twinlink-relay:dev
    container_name: twinlink-relay
    restart: unless-stopped

    # A TUN device plus iptables; both are unavoidable for a bonding relay.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun

    # net.ipv4.ip_forward is namespaced, so this is enough inside the container.
    sysctls:
      net.ipv4.ip_forward: "1"

    ports:
      # the tunnel itself
      - "51821:51821/udp"
      # control API: published on loopback only, it has no authentication
      - "127.0.0.1:51822:51822/tcp"

    environment:
      # Required: >= 16 bytes. compose fails fast when it is missing.
      TWINLINK_SECRET: ${TWINLINK_SECRET:?set TWINLINK_SECRET (at least 16 bytes)}
      TWINLINK_WAN_IFACE: ${TWINLINK_WAN_IFACE:-eth0}

    command:
      - --listen=0.0.0.0:51821
      - --http=0.0.0.0:51822
      - --tun=twinlink0
      - --wan-iface=${TWINLINK_WAN_IFACE:-eth0}
      - --setup-nat
      - --log-level=info

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:51822/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Note: with bridge networking --setup-nat applies MASQUERADE inside the
# container's own network namespace, which is exactly what the tun -> eth0 path
# needs. If you would rather NAT on the host itself, replace the ports section
# with `network_mode: host` and drop --setup-nat in favour of running
# `twinlink-relay --print-nat` and applying the printed commands on the host.
